name: Release

# Push a tag like v2.0.0 to test, package and upload to CurseForge (project 1815823, from the
# TOC) and to a GitHub release. Needs the CF_API_KEY repository secret (a CurseForge API token).
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Package and upload
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
